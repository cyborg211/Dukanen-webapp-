name: Dukanen Quality Gate

on:
  push:
    branches: [dukanen-final-uiux]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Package validated preview source
        uses: actions/upload-artifact@v4
        with:
          name: dukanen-preview-source
          path: |
            .env.example
            package.json
            tsconfig.json
            next-env.d.ts
            middleware.ts
            app/**
            components/**
            lib/**
          if-no-files-found: error
          retention-days: 1
